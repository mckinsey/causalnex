# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS and Python version used to build the docs.
# ubuntu-22.04 is the newest RTD build OS that still provides Python 3.8,
# which the pinned doc/test requirements need.
build:
  os: ubuntu-22.04
  tools:
    python: "3.8"

# Build documentation in the docs/ directory with Sphinx
sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: false

# Optionally set the requirements required to build your docs
python:
  install:
    - method: pip
      path: .
    - requirements: test_requirements.txt
    - requirements: doc_requirements.txt
