# ============================================================================
# Default Node Instances for the Global Relationship Graph
# ============================================================================
#
# Each entry is a concrete node in the graph.  The key becomes the node ID
# used in CausalNex (must match ^[0-9a-zA-Z_]+$).
#
# Schema per entry:
#   type    : Must reference a key in node_types.yaml
#   label   : Human-readable display name
#   domain  : Free-text domain tag for filtering / grouping
#
# Extend this file to add nodes.  No code changes needed.
# ============================================================================

