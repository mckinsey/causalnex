# ============================================================================
# Default Expert Causal Edges for the Global Relationship Graph
# ============================================================================
#
# Each entry defines a directed causal edge between two node instances.
#
# Schema per entry:
#   source      : Node ID (must exist in default_nodes.yaml or user registry)
#   target      : Node ID
#   edge_type   : Must reference a key in edge_types.yaml
#   origin      : "expert" (domain knowledge) or "learned" (data-driven)
#   weight      : Optional strength (0.0–1.0), defaults to 1.0
#   description : Optional human-readable explanation of WHY this edge exists
#
# These edges form the expert skeleton.  DYNOTEARS or other structure
# learning can add "learned" edges on top.
# ============================================================================

