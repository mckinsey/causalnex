# --- Causation & Events ---

triggers:
  label: "Triggers"
  category: "causation"
  directed: true
  description: "Source action or state directly triggers target event or state change"
  typical_pairs:
    - [political_figure, geopolitical_event]
    - [climate, geopolitical_event]
    - [geopolitical_event, geopolitical_event]

disrupts:
  label: "Disrupts"
  category: "causation"
  directed: true
  description: "Source event or condition disrupts normal functioning of target"
  typical_pairs:
    - [geopolitical_event, trade_route]
    - [geopolitical_event, commodity]
    - [climate, trade_route]
    - [climate, commodity]
    - [public_health, industry]

destabilizes:
  label: "Destabilizes"
  category: "causation"
  directed: true
