    - [social_movement, sovereign_state]
    - [public_health, sovereign_state]
    - [climate, sovereign_state]

escalates:
  label: "Escalates"
  category: "causation"
  directed: true
  description: "Source causes target conflict or tension to intensify"
  typical_pairs:
    - [military, geopolitical_event]
    - [political_figure, geopolitical_event]
    - [media, geopolitical_event]

