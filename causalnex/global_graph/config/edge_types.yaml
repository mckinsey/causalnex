# ============================================================================
# Relationship Type Definitions for the Global Relationship Graph
# ============================================================================
#
# Each entry defines a *type* of directed edge between nodes.
#
# Schema per entry:
#   label        : Human-readable verb/phrase
#   category     : Broad grouping (trade, governance, conflict, …)
#   directed     : Whether the relationship is inherently directional
#   description  : What this relationship means causally
#   typical_pairs: Common (source_type → target_type) pairs where this edge
#                  is expected. Used for validation hints, not hard constraints.
#
# To add a new relationship type, append an entry — no code changes needed.
# ============================================================================

# --- Trade & Economics ---

exports_to:
  label: "Exports To"
  category: "trade"
  directed: true
  description: "Source exports goods, services, or capital to target"
  typical_pairs:
    - [sovereign_state, sovereign_state]
    - [corporation, sovereign_state]

imports_from:
  label: "Imports From"
  category: "trade"
  directed: true
  description: "Source imports goods, services, or capital from target"
  typical_pairs:
    - [sovereign_state, sovereign_state]

supplies:
  label: "Supplies"
  category: "trade"
  directed: true
  description: "Source is a critical supplier of a resource or component to target"
  typical_pairs:
    - [sovereign_state, commodity]
    - [corporation, industry]
    - [trade_route, sovereign_state]

depends_on:
  label: "Depends On"
  category: "trade"
  directed: true
  description: "Source has a material dependency on target for functioning"
  typical_pairs:
    - [industry, commodity]
    - [corporation, tech_infra]
    - [sovereign_state, trade_route]
    - [sovereign_state, energy_infra]

competes_with:
  label: "Competes With"
  category: "trade"
  directed: false
  description: "Source and target are in direct competition (market share, influence, resources)"
  typical_pairs:
    - [corporation, corporation]
    - [sovereign_state, sovereign_state]
    - [currency, currency]

# --- Governance & Regulation ---

regulates:
  label: "Regulates"
  category: "governance"
  directed: true
  description: "Source imposes rules, constraints, or oversight on target"
  typical_pairs:
    - [regulatory, industry]
    - [regulatory, corporation]
    - [intl_organization, sovereign_state]
    - [sovereign_state, corporation]

sanctions:
  label: "Sanctions"
  category: "governance"
  directed: true
  description: "Source imposes economic or diplomatic sanctions on target"
  typical_pairs:
    - [sovereign_state, sovereign_state]
    - [intl_organization, sovereign_state]
    - [sovereign_state, corporation]

member_of:
  label: "Member Of"
  category: "governance"
  directed: true
  description: "Source is a member or participant of target organization/agreement"
  typical_pairs:
    - [sovereign_state, intl_organization]
    - [sovereign_state, regulatory]
    - [corporation, intl_organization]

enforces:
  label: "Enforces"
  category: "governance"
  directed: true
  description: "Source enforces the rules or mandates of target framework"
  typical_pairs:
    - [intl_organization, regulatory]
    - [sovereign_state, regulatory]

